# Simkl Visit for Quantumult X
# 用法：把下面三段分别粘贴进你 QX 配置文件对应的 [MITM] / [rewrite_local] / [task_local] 区块里。
# 如果你已经有这几个区块，不要重复添加 [MITM] 等标题行，只需把内容行合并进去。
#
# 脚本文件 simkl_visit_qx.js 需要放到：
#   iCloud Drive/Quantumult X/Scripts/  或  On My iPhone/Quantumult X/Scripts/
# 或者你也可以把 script-path 换成可公网访问的 raw 链接（比如自己 GitHub 仓库的 raw 地址）。

[MITM]
hostname = simkl.com

[rewrite_local]
^https:\/\/simkl\.com\/ url script-request-header https://raw.githubusercontent.com/kefengyoyo/own/refs/heads/main/simkl_visit_qx.js

[task_local]
0 8 * * * https://raw.githubusercontent.com/kefengyoyo/own/refs/heads/main/simkl_visit_qx.js, tag=Simkl Scheduled Visit, enabled=true
